<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Confirmation</title>
    <meta name="description" content="Confirmation page for a submitted product review.">
    <meta name="author" content="Shelby Baird">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/review.js" defer></script>
</head>

<body>
    <header>
        <h1>Review Submitted</h1>
    </header>

    <main>
        <section class="confirmation">
            <h2>Thank you for your review! 🎉</h2>
            <p>Your review has been received.</p>

            <p id="product-line"></p>
            <p id="rating-line"></p>

            <p class="counter">
                This product has been reviewed
                <span id="review-count"></span> time(s).
            </p>
        </section>
    </main>

    <footer>
        <p>&#169; ☘️ <span id="year"></span> Shelby Baird ☘️ Utah</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
